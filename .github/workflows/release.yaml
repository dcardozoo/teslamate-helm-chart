name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify tag matches Chart.yaml version
        run: |
          chart_version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' Chart.yaml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart_version}"
            exit 1
          fi
          echo "VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Package chart
        run: |
          helm package . --destination dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        id: push
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/teslamate-${VERSION}.tgz" "oci://${REGISTRY}/${owner}/charts" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log | tail -1)"
          [ -n "$digest" ] || { echo "::error::could not determine pushed digest"; exit 1; }
          echo "ref=${REGISTRY}/${owner}/charts/teslamate@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign (keyless)
        run: |
          # cosign reads Docker credentials, not the ones from helm registry login.
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          cosign sign --yes "${{ steps.push.outputs.ref }}"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push Artifact Hub repository metadata
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          oras push "${REGISTRY}/${owner}/charts/teslamate:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/teslamate-${VERSION}.tgz" \
            --title "teslamate ${VERSION}" --generate-notes --verify-tag
