{{- if .Values.mosquitto.enabled }}
{{- $mq := .Values.mosquitto }}
{{- $name := include "teslamate.componentName" (dict "ctx" . "component" "mosquitto") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "teslamate.labels" (dict "ctx" . "component" "mosquitto") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "teslamate.selectorLabels" (dict "ctx" . "component" "mosquitto") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/mosquitto/configmap.yaml") . | sha256sum }}
        {{- with $mq.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "teslamate.labels" (dict "ctx" . "component" "mosquitto") | nindent 8 }}
        {{- with $mq.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "teslamate.imagePullSecrets" . | nindent 6 }}
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- with $mq.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $mq.podSecurityContext | nindent 8 }}
      containers:
        - name: mosquitto
          image: {{ include "teslamate.image" (dict "ctx" . "image" $mq.image) }}
          imagePullPolicy: {{ $mq.image.pullPolicy }}
          command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
          resources:
            {{- toYaml $mq.resources | nindent 12 }}
          securityContext:
            {{- toYaml $mq.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          {{- if $mq.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $mq.persistence.existingClaim | default $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $mq.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mq.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mq.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
