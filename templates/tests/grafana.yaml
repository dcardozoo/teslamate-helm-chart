{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Pod
metadata:
  {{- include "teslamate.testMetadata" (dict "ctx" . "component" "grafana") | nindent 2 }}
spec:
  {{- include "teslamate.testPodSpec" (dict "ctx" .) | nindent 2 }}
  containers:
    - name: health
      image: {{ printf "%s:%s" .Values.tests.curlImage.repository .Values.tests.curlImage.tag }}
      command:
        - sh
        - -ec
        - |
          body=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            "http://{{ include "teslamate.componentName" (dict "ctx" . "component" "grafana") }}:{{ .Values.grafana.service.port }}/api/health")
          echo "$body"
          echo "$body" | grep -q '"database": *"ok"'
      {{- include "teslamate.testContainerSecurityContext" . | nindent 6 }}
{{- end }}
