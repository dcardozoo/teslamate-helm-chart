{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslamate.componentName" (dict "ctx" . "component" "grafana") }}
  labels:
    {{- include "teslamate.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
  {{- with .Values.grafana.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "teslamate.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
{{- end }}
