{{- if and .Values.teslamate.enabled (not .Values.teslamate.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teslamate.fullname" . }}
  labels:
    {{- include "teslamate.labels" (dict "ctx" . "component" "teslamate") | nindent 4 }}
type: Opaque
data:
  {{ .Values.teslamate.existingSecretKey }}: {{ .Values.teslamate.encryptionKey | b64enc | quote }}
{{- end }}
