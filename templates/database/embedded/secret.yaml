{{- if and (include "teslamate.embeddedEnabled" .) (not .Values.database.embedded.existingSecret) }}
{{- $name := include "teslamate.embedded.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "teslamate.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  # Kept with the retained PVC: the password is only applied when the data directory is initialised.
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.database.embedded.username | b64enc | quote }}
  password: {{ dig "data" "password" (randAlphaNum 32 | b64enc) $existing | quote }}
{{- end }}
