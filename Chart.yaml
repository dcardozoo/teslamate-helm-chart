apiVersion: v2
name: teslamate
description: >-
  TeslaMate data logger with Grafana dashboards, Mosquitto MQTT broker and a highly available
  CloudNativePG PostgreSQL cluster. Requires the CloudNativePG operator (and the Barman Cloud plugin
  for backups) to be installed separately, or an external PostgreSQL server.
type: application
version: 0.3.0
appVersion: "4.4.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/dcardozoo/teslamate-helm-chart
icon: https://raw.githubusercontent.com/teslamate-org/teslamate/master/website/static/img/logo.svg
sources:
  - https://github.com/dcardozoo/teslamate-helm-chart
  - https://github.com/teslamate-org/teslamate
  - https://github.com/cloudnative-pg/cloudnative-pg
  - https://github.com/cloudnative-pg/plugin-barman-cloud
keywords:
  - teslamate
  - tesla
  - grafana
  - mosquitto
  - mqtt
  - postgresql
  - cloudnative-pg
  - cnpg
  - barman
maintainers:
  - name: dcardozoo
    email: github@danieljcardozo.com
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/links: |
    - name: CloudNativePG operator installation (prerequisite)
      url: https://cloudnative-pg.io/docs/current/installation_upgrade/
    - name: Barman Cloud plugin installation (prerequisite for backups)
      url: https://cloudnative-pg.io/plugin-barman-cloud/docs/installation/
  artifacthub.io/images: |
    - name: teslamate
      image: teslamate/teslamate:4.4.0
    - name: grafana
      image: teslamate/grafana:4.4.0
    - name: mosquitto
      image: eclipse-mosquitto:2.1.2-alpine
    - name: postgresql
      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    - name: postgresql-embedded
      image: postgres:18.6-trixie
